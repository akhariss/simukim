name: CI/CD — Build, Test & Deploy SIMUKIM

on:
  push:
    branches: [ main ]

jobs:
  # ============================================================
  # TAHAP 1: CONTINUOUS INTEGRATION (CI)
  # Menguji seluruh 151 skenario tes otomatis sebelum build Docker
  # ============================================================
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, zip, gd, intl, dom, fileinfo
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Application Key & Database Test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Execute 151 PHPUnit Tests
        run: php artisan test

  # ============================================================
  # TAHAP 2: CONTINUOUS DEPLOYMENT (CD)
  # Build Docker Image, Push ke Docker Hub, & Deploy ke Server
  # ============================================================
  build-and-deploy:
    name: Build Docker Image & Deploy via SSH
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            kenn1213/mahad:latest
            kenn1213/mahad:${{ github.sha }}

      - name: Deploy to Server via SSH & Inject Secrets
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # 1. Masuk ke direktori aplikasi di server
            DEPLOY_DIR="${{ secrets.SERVER_DEPLOY_PATH }}"
            DEPLOY_DIR="${DEPLOY_DIR:-/home/ubuntu/simukim}"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # 2. Tulis berkas .env produksi secara otomatis dari GitHub Secrets
            cat << 'EOF' > .env
            APP_NAME="SIMUKIM"
            APP_ENV=production
            APP_KEY=${{ secrets.ENV_APP_KEY }}
            APP_DEBUG=false
            APP_TIMEZONE=Asia/Jakarta
            APP_URL=https://${{ secrets.SERVER_HOST }}

            DB_CONNECTION=mysql
            DB_HOST=db
            DB_PORT=3306
            DB_DATABASE=${{ secrets.ENV_DB_DATABASE || 'mahad_db' }}
            DB_USERNAME=${{ secrets.ENV_DB_USERNAME || 'mahad_user' }}
            DB_PASSWORD=${{ secrets.ENV_DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.ENV_DB_ROOT_PASSWORD || secrets.ENV_DB_PASSWORD }}

            CAMPUS_API_BASE_URL=${{ secrets.ENV_CAMPUS_API_BASE_URL || 'https://bridge.uinssc.ac.id' }}
            BRIDGE_API_URL=${{ secrets.ENV_BRIDGE_API_URL || 'https://bridge.uinssc.ac.id' }}
            CAMPUS_API_TIMEOUT=5
            CAMPUS_API_VERIFY_SSL=true

            SAHAJA_API_URL=${{ secrets.ENV_SAHAJA_API_URL || 'https://sahaja.uinssc.ac.id' }}
            SAHAJA_API_KEY=${{ secrets.ENV_SAHAJA_API_KEY }}
            SAHAJA_API_TIMEOUT=5
            SAHAJA_API_VERIFY_SSL=true

            SESSION_DRIVER=file
            CACHE_STORE=file
            QUEUE_CONNECTION=sync
            FILESYSTEM_DISK=local
            EOF

            # 3. Pastikan berkas docker-compose.yml terbaru tersedia di server
            if [ ! -f docker-compose.yml ]; then
              echo "docker-compose.yml belum ditemukan, silakan salin docker-compose.yml dari repositori ke folder ini."
            fi

            # 4. Tarik image terbaru dari Docker Hub
            docker compose pull app

            # 5. Jalankan container baru
            docker compose up -d

            # 6. Jalankan migrasi database aman & optimasi cache Laravel di dalam container
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan optimize

            echo "🚀 Deployment SIMUKIM (kenn1213/mahad:latest) Berhasil!"

