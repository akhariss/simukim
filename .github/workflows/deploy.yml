name: Deploy SIMUKIM via Docker

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            kenn1213/mahad:latest
            kenn1213/mahad:${{ github.sha }}

      - name: Deploy to Server via SSH & Auto-Setup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # 1. Pastikan folder aplikasi ada di server
            DEPLOY_DIR="${{ secrets.SERVER_DEPLOY_PATH }}"
            DEPLOY_DIR="${DEPLOY_DIR:-/home/ubuntu/simukim}"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # 2. Tentukan APP_URL (Default ke http://<IP_SERVER> jika belum pasang domain)
            APP_URL_VAL="${{ secrets.ENV_APP_URL }}"
            if [ -z "$APP_URL_VAL" ]; then
              APP_URL_VAL="http://${{ secrets.SERVER_HOST }}"
            fi

            # 3. Tentukan APP_KEY (Ambil dari Secret, atau pertahankan yang ada, atau generate aman)
            EXISTING_KEY=""
            if [ -f .env ]; then
              EXISTING_KEY=$(grep '^APP_KEY=' .env | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
            fi

            APP_KEY_VAL="${{ secrets.ENV_APP_KEY }}"
            if [ -z "$APP_KEY_VAL" ]; then
              if [ -n "$EXISTING_KEY" ] && [ "$EXISTING_KEY" != "" ]; then
                APP_KEY_VAL="$EXISTING_KEY"
              else
                APP_KEY_VAL="base64:$(openssl rand -base64 32)"
              fi
            fi

            # 4. Tentukan DB_PASSWORD
            DB_PASS_VAL="${{ secrets.ENV_DB_PASSWORD }}"
            if [ -z "$DB_PASS_VAL" ]; then
              if [ -f .env ]; then
                EXISTING_PASS=$(grep '^DB_PASSWORD=' .env | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
              fi
              DB_PASS_VAL="${EXISTING_PASS:-SimukimMahad2026!}"
            fi

            # 5. Tulis berkas .env produksi secara otomatis
            echo 'APP_NAME="SIMUKIM"' > .env
            echo 'APP_ENV="production"' >> .env
            echo "APP_KEY=\"$APP_KEY_VAL\"" >> .env
            echo 'APP_DEBUG=false' >> .env
            echo 'APP_TIMEZONE="Asia/Jakarta"' >> .env
            echo "APP_URL=\"$APP_URL_VAL\"" >> .env
            echo 'DB_CONNECTION="mysql"' >> .env
            echo 'DB_HOST="db"' >> .env
            echo 'DB_PORT="3306"' >> .env
            echo "DB_DATABASE=\"${{ secrets.ENV_DB_DATABASE || 'mahad_db' }}\"" >> .env
            echo "DB_USERNAME=\"${{ secrets.ENV_DB_USERNAME || 'mahad_user' }}\"" >> .env
            echo "DB_PASSWORD=\"$DB_PASS_VAL\"" >> .env
            echo "DB_ROOT_PASSWORD=\"${{ secrets.ENV_DB_ROOT_PASSWORD || '' }}\"" >> .env
            sed -i '/DB_ROOT_PASSWORD=""/d' .env 2>/dev/null || true
            if ! grep -q 'DB_ROOT_PASSWORD=' .env; then
              echo "DB_ROOT_PASSWORD=\"$DB_PASS_VAL\"" >> .env
            fi
            echo "CAMPUS_API_BASE_URL=\"${{ secrets.ENV_CAMPUS_API_BASE_URL || 'https://bridge.uinssc.ac.id' }}\"" >> .env
            echo "BRIDGE_API_URL=\"${{ secrets.ENV_BRIDGE_API_URL || 'https://bridge.uinssc.ac.id' }}\"" >> .env
            echo 'CAMPUS_API_TIMEOUT=5' >> .env
            echo 'CAMPUS_API_VERIFY_SSL=true' >> .env
            echo "SAHAJA_API_URL=\"${{ secrets.ENV_SAHAJA_API_URL || 'https://sahaja.uinssc.ac.id' }}\"" >> .env
            echo "SAHAJA_API_KEY=\"${{ secrets.ENV_SAHAJA_API_KEY || 'dev-key-sahaja-2026' }}\"" >> .env
            echo 'SAHAJA_API_TIMEOUT=5' >> .env
            echo 'SAHAJA_API_VERIFY_SSL=true' >> .env
            echo 'SESSION_DRIVER="file"' >> .env
            echo 'CACHE_STORE="file"' >> .env
            echo 'QUEUE_CONNECTION="sync"' >> .env
            echo 'FILESYSTEM_DISK="local"' >> .env

            # 6. Ambil berkas docker-compose.yml terbaru dari repositori
            curl -fsSL https://raw.githubusercontent.com/akhariss/kp/main/docker-compose.yml -o docker-compose.yml

            # 7. Tarik image terbaru dari Docker Hub
            docker compose pull app

            # 8. Jalankan container baru
            docker compose up -d

            # 9. Bersihkan cache lama, tunggu database siap lalu jalankan migrasi database & cache optimize
            echo "Menunggu database siap..."
            sleep 8
            docker compose exec -T app php artisan config:clear
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan optimize

            echo "🚀 Deployment SIMUKIM (kenn1213/mahad:latest) Berhasil!"
