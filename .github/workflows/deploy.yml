name: Deploy SIMUKIM via Docker

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/simukim:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/simukim:${{ github.sha }}

  deploy:
    name: Deploy to Campus Server (Self-Hosted)
    needs: build
    runs-on: self-hosted

    env:
      DOCKER_IMAGE_VAL: ${{ secrets.DOCKERHUB_USERNAME }}/simukim:latest
      DEPLOY_DIR_VAL: ${{ secrets.SERVER_DEPLOY_PATH || '/www/wwwroot/simukim' }}
      ENV_APP_URL: ${{ secrets.ENV_APP_URL }}
      ENV_APP_KEY: ${{ secrets.ENV_APP_KEY }}
      ENV_DB_DATABASE: ${{ secrets.ENV_DB_DATABASE || 'mahad_db' }}
      ENV_DB_USERNAME: ${{ secrets.ENV_DB_USERNAME || 'mahad_user' }}
      ENV_DB_PASSWORD: ${{ secrets.ENV_DB_PASSWORD }}
      ENV_DB_ROOT_PASSWORD: ${{ secrets.ENV_DB_ROOT_PASSWORD }}
      ENV_CAMPUS_API_BASE_URL: ${{ secrets.ENV_CAMPUS_API_BASE_URL || 'https://bridge.uinssc.ac.id' }}
      ENV_BRIDGE_API_URL: ${{ secrets.ENV_BRIDGE_API_URL || 'https://bridge.uinssc.ac.id' }}
      ENV_SAHAJA_API_URL: ${{ secrets.ENV_SAHAJA_API_URL || 'https://sahaja.uinssc.ac.id' }}
      ENV_SAHAJA_API_KEY: ${{ secrets.ENV_SAHAJA_API_KEY || 'dev-key-sahaja-2026' }}
      SERVER_HOST_VAL: ${{ secrets.SERVER_HOST }}

    steps:
      - name: Checkout docker-compose.yml
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy Containers & Run Migrations
        run: |
          set -e
          COMPOSE_SRC="$PWD/docker-compose.yml"
          DEPLOY_DIR="$DEPLOY_DIR_VAL"
          mkdir -p "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"

          APP_URL_VAL="$ENV_APP_URL"
          if [ -z "$APP_URL_VAL" ]; then
            APP_URL_VAL="http://${SERVER_HOST_VAL:-103.140.22.112}"
          fi

          EXISTING_KEY=""
          if [ -f .env ]; then
            EXISTING_KEY=$(grep '^APP_KEY=' .env | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
          fi

          APP_KEY_VAL="$ENV_APP_KEY"
          if [ -z "$APP_KEY_VAL" ]; then
            if [ -n "$EXISTING_KEY" ]; then
              APP_KEY_VAL="$EXISTING_KEY"
            else
              APP_KEY_VAL="base64:$(openssl rand -base64 32)"
            fi
          fi

          DB_PASS_VAL="$ENV_DB_PASSWORD"
          if [ -z "$DB_PASS_VAL" ]; then
            if [ -f .env ]; then
              EXISTING_PASS=$(grep '^DB_PASSWORD=' .env | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
            fi
            DB_PASS_VAL="${EXISTING_PASS:-SimukimMahad2026!}"
          fi

          DB_ROOT_VAL="${ENV_DB_ROOT_PASSWORD:-$DB_PASS_VAL}"

          cat > .env << ENVFILE
          APP_NAME="SIMUKIM"
          APP_ENV="production"
          APP_KEY="$APP_KEY_VAL"
          APP_DEBUG=false
          APP_TIMEZONE="Asia/Jakarta"
          APP_URL="$APP_URL_VAL"
          DB_CONNECTION="mysql"
          DB_HOST="db"
          DB_PORT="3306"
          DB_DATABASE="$ENV_DB_DATABASE"
          DB_USERNAME="$ENV_DB_USERNAME"
          DB_PASSWORD="$DB_PASS_VAL"
          DB_ROOT_PASSWORD="$DB_ROOT_VAL"
          CAMPUS_API_BASE_URL="$ENV_CAMPUS_API_BASE_URL"
          BRIDGE_API_URL="$ENV_BRIDGE_API_URL"
          CAMPUS_API_TIMEOUT=5
          CAMPUS_API_VERIFY_SSL=true
          SAHAJA_API_URL="$ENV_SAHAJA_API_URL"
          SAHAJA_API_KEY="$ENV_SAHAJA_API_KEY"
          SAHAJA_API_TIMEOUT=5
          SAHAJA_API_VERIFY_SSL=true
          SESSION_DRIVER="file"
          CACHE_STORE="file"
          QUEUE_CONNECTION="sync"
          FILESYSTEM_DISK="local"
          DOCKER_IMAGE="$DOCKER_IMAGE_VAL"
          ENVFILE

          cp "$COMPOSE_SRC" docker-compose.yml

          docker compose pull app
          docker compose up -d

          echo "Menunggu database siap..."
          sleep 10
          docker compose exec -T app php artisan config:clear
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan optimize

          echo "🚀 Deployment SIMUKIM ($DOCKER_IMAGE_VAL) Berhasil!"
