name: Deploy SIMUKIM via Docker

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            kenn1213/mahad:latest
            kenn1213/mahad:${{ github.sha }}

      - name: Deploy to Server via SSH & Auto-Setup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # 1. Pastikan folder aplikasi ada di server
            DEPLOY_DIR="${{ secrets.SERVER_DEPLOY_PATH }}"
            DEPLOY_DIR="${DEPLOY_DIR:-/home/ubuntu/simukim}"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # 2. Tentukan APP_URL (Default ke http://<IP_SERVER> jika belum pasang domain)
            APP_URL_VAL="${{ secrets.ENV_APP_URL }}"
            if [ -z "$APP_URL_VAL" ]; then
              APP_URL_VAL="http://${{ secrets.SERVER_HOST }}"
            fi

            # 3. Tulis berkas .env produksi secara otomatis dari GitHub Secrets
            cat << 'EOF' > .env
            APP_NAME="SIMUKIM"
            APP_ENV=production
            APP_KEY=${{ secrets.ENV_APP_KEY }}
            APP_DEBUG=false
            APP_TIMEZONE=Asia/Jakarta
            APP_URL=$APP_URL_VAL

            DB_CONNECTION=mysql
            DB_HOST=db
            DB_PORT=3306
            DB_DATABASE=${{ secrets.ENV_DB_DATABASE || 'mahad_db' }}
            DB_USERNAME=${{ secrets.ENV_DB_USERNAME || 'mahad_user' }}
            DB_PASSWORD=${{ secrets.ENV_DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.ENV_DB_ROOT_PASSWORD || secrets.ENV_DB_PASSWORD }}

            CAMPUS_API_BASE_URL=${{ secrets.ENV_CAMPUS_API_BASE_URL || 'https://bridge.uinssc.ac.id' }}
            BRIDGE_API_URL=${{ secrets.ENV_BRIDGE_API_URL || 'https://bridge.uinssc.ac.id' }}
            CAMPUS_API_TIMEOUT=5
            CAMPUS_API_VERIFY_SSL=true

            SAHAJA_API_URL=${{ secrets.ENV_SAHAJA_API_URL || 'https://sahaja.uinssc.ac.id' }}
            SAHAJA_API_KEY=${{ secrets.ENV_SAHAJA_API_KEY }}
            SAHAJA_API_TIMEOUT=5
            SAHAJA_API_VERIFY_SSL=true

            SESSION_DRIVER=file
            CACHE_STORE=file
            QUEUE_CONNECTION=sync
            FILESYSTEM_DISK=local
            EOF

            # 4. Tulis berkas docker-compose.yml produksi secara otomatis
            cat << 'COMPOSE_EOF' > docker-compose.yml
            services:
              app:
                image: kenn1213/mahad:latest
                container_name: simukim_app
                restart: unless-stopped
                ports:
                  - "80:80"
                env_file:
                  - .env
                volumes:
                  - simukim_storage:/var/www/html/storage/app
                depends_on:
                  db:
                    condition: service_healthy
                networks:
                  - simukim_net

              db:
                image: mysql:8.0
                container_name: simukim_db
                restart: unless-stopped
                command: --default-authentication-plugin=mysql_native_password
                environment:
                  MYSQL_DATABASE: ${DB_DATABASE:-mahad_db}
                  MYSQL_USER: ${DB_USERNAME:-mahad_user}
                  MYSQL_PASSWORD: ${DB_PASSWORD}
                  MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_sangat_rahasia}
                volumes:
                  - simukim_db_data:/var/lib/mysql
                networks:
                  - simukim_net
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_sangat_rahasia}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

            volumes:
              simukim_storage:
                name: simukim_storage
              simukim_db_data:
                name: simukim_db_data

            networks:
              simukim_net:
                name: simukim_net
            COMPOSE_EOF

            # 5. Tarik image terbaru dari Docker Hub
            docker compose pull app

            # 6. Jalankan container baru
            docker compose up -d

            # 7. Tunggu sesaat hingga MySQL siap lalu jalankan migrasi database & cache optimize
            echo "Menunggu database siap..."
            sleep 5
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan optimize

            echo "🚀 Deployment SIMUKIM (kenn1213/mahad:latest) Berhasil!"
